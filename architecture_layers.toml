[results_v2.responsibilities]
"intent:results-v2:hhplab" = "Scoped root for results recipe implementation; not a replacement for whole-codebase legacy intent."
"intent:results-v2:schema" = "Retain canonical schema ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:storage" = "Retain canonical storage ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:recipe" = "Retain canonical recipe ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:analysis" = "Retain canonical analysis ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:results" = "Retain canonical results ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:cli" = "Retain canonical cli ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:build_cmds" = "CLI adapters including existing named result workflows; avoid business logic in command handlers."
"intent:results-v2:covariates" = "Retain canonical covariates ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:executor" = "Dispatch build and analysis tasks; no estimators or result decision rules in executor."
"intent:results-v2:registry" = "Retain canonical registry ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:sources" = "Retain canonical sources ownership and passive facade; new results functionality follows architecture_layers.toml."
"intent:results-v2:analysis_contracts" = "Typed analysis result/frame interfaces and capability/undefined-result errors."
"intent:results-v2:analysis_dispatch" = "Dispatch resolved analysis plans to analysis engine; persist sample/result outputs and enforce frame identity."
"intent:results-v2:bands" = "Pure interval constraint validation, exact overlap witnesses and finding band evaluation; no recipe/CLI/runner imports."
"intent:results-v2:bundle" = "Portable bundle writer, original/resolved/execution separation, manifest and hashes, partial/failure bundles; delegate report rendering."
"intent:results-v2:cli_commands" = "Register new results group alongside existing commands without eager implementation ownership."
"intent:results-v2:cli_recipe" = "Delegate v2 preflight appropriately; preserve v1 recipe build behavior."
"intent:results-v2:cli_results" = "New results check/run/lock/history/verify group; JSON and exit codes; delegates application services."
"intent:results-v2:correlation" = "Resolved-frame listwise Pearson/Spearman, no silent sample changes; preserve path API."
"intent:results-v2:covariate_catalog" = "Declare reviewed redistribution terms and evidence for source specs; unknown default."
"intent:results-v2:derive" = "Pure masks and closed derivation operations over full keyed panels; retain mask/baseline lineage; never silently drop rows."
"intent:results-v2:diagnostics" = "Closed column/linear identity checks, per-variant applicability, same-design evidence and declared tolerances."
"intent:results-v2:estimation" = "OLS/WLS numerical fitting and covariance inputs; retain existing 2SLS public behavior outside v2."
"intent:results-v2:inspection" = "Resolved-frame grouped descriptives, type-7 quantiles and threshold shares; preserve path API."
"intent:results-v2:ledger" = "Append-only run/lock events, leases, process identity, torn-write handling and durable concurrency; consumes wire contracts only."
"intent:results-v2:lineage" = "Propagate source terms to columns, sample dependencies and result/report artifacts; produce packaging withholding decisions."
"intent:results-v2:loader" = "Dispatch v1/v2 models without changing v1 semantics."
"intent:results-v2:model" = "Weighted design/absorbed FE preparation, intercept, identification, full design rank and nested-FE correction rank."
"intent:results-v2:readiness" = "Frame-level numeric, variation, rank and inference readiness checks with structured diagnostics; shared design preparation."
"intent:results-v2:recipe_findings" = "Recipe-specific finding instances and robustness precedence, resolving base_term and undefined required criteria; separate from historical workflow sidecars."
"intent:results-v2:redistribution_contracts" = "Shared row-level and aggregate redistribution enums, lineage contracts and conservative status combination; provider-neutral."
"intent:results-v2:regression" = "Resolved-frame regression API; compatibility wrapper for path API; sample invariant, inference and result contracts."
"intent:results-v2:report" = "Offline HTML/CSV and README rendering from structured result payloads; four statuses and failures first; no estimation."
"intent:results-v2:result_contracts" = "Versioned bundle, result, status, sample and findings wire contracts; dependency-free of application modules."
"intent:results-v2:result_planner" = "Resolve panel refs, overrides, substitutions, groups, dependency graph, component identities and static preflight; numerical readiness delegated."
"intent:results-v2:results_runner" = "Own end-to-end lifecycle: build, masks/derive, samples, readiness, dispatch, diagnostics/findings, bundle and ledger; failure scope controls independent progress."
"intent:results-v2:samples" = "Resolve exact membership and ordered exclusions, group unions, iterative removals and inference-only base reuse; readiness owns numerical validation."
"intent:results-v2:source_coverage" = "Expose core source metadata and redistribution declarations using shared contracts."
"intent:results-v2:source_registry" = "Store source redistribution metadata using shared contracts without importing domain catalog or application."
"intent:results-v2:stats" = "Classical, HC1, CR1 corrections and consistent t-based intervals/p-values; no recipe dependencies."
"intent:results-v2:v2_schema" = "RecipeV2 and closed result sections, parameters, capability validation and v1 build composition; no statistical algorithms."
"intent:results-v2:verify" = "Integrity-first replay using bundled panels only, shared execution services without upstream build/ledger side effects, exact sample comparison and tolerance/status precedence."
"intent:site-universe:input_resolver" = "Resolve and validate the paired site and membership tables, schema, artifact identity, explicit threshold, row uniqueness and fingerprints for RecipeV2 inputs."
"intent:site-universe:site_year_aggregation" = "Aggregate complete site-year outcomes over frozen memberships using validated panel/year source-ID sets and single, preaggregated, or sum operations; prevent cross-site source reuse and double counts, and preserve explicit incomplete status without partial sums or allocation. Consume the PIT observation module's source declarations and measure-specific eligibility predicates to emit source-limited statuses and member diagnostics without modifying reported source values."
"intent:site-universe:pit_observation" = "Own source-declared PIT observation metadata and measure-specific eligibility predicates. Preserve reported values and constituent declarations, distinguish observed, carried-forward, partial and unknown counts, and require complete member coverage when aggregating metadata. Never infer observation from repeated numeric values or select study geography, research periods or estimator samples."
"intent:site-universe:coc_boundary_compatibility" = "Own versioned, evidence-backed CoC boundary and count reconciliation for historical site-year use. Separate geometric equivalence from approved count reconciliation; require explicit source-ID sets, panel/year operations, count evidence and review approval for predecessor unions; never infer reconciliation from a persistent ID alone."
"intent:site-universe:storage_config" = "Resolve one deterministic recipe output root across CLI, environment, recipe, repository, user and default configuration while keeping asset_store_root separate."
"intent:site-universe:recipe_output_root_schema" = "Declare the shared RecipeV1 output_root field inherited by V2 while keeping site_universe input semantics V2-only."

