[layers]
# Higher layers may depend on lower layers. The quality gate rejects dependencies
# in the opposite direction unless the exact edge is temporarily allowlisted.
order = ["contracts", "infrastructure", "domain", "application", "interface"]

[packages]
"hhplab.cli" = "interface"

"hhplab.panel" = "application"
"hhplab.recipe" = "application"
"hhplab.results" = "application"
"hhplab.viz" = "application"

"hhplab.sources.bls" = "domain"
"hhplab.sources.cdc" = "domain"
"hhplab.sources.census" = "domain"
"hhplab.sources.mpi" = "domain"
"hhplab.covariates" = "domain"
"hhplab.geo" = "domain"
"hhplab.measures" = "domain"
"hhplab.medsl" = "domain"
"hhplab.metro" = "domain"
"hhplab.msa" = "domain"
"hhplab.nhgis" = "domain"
"hhplab.sources.hud" = "domain"
"hhplab.prism" = "domain"
"hhplab.rents" = "domain"
"hhplab.vera" = "domain"
"hhplab.xwalks" = "domain"

"hhplab.registry" = "infrastructure"

"hhplab.schema" = "contracts"

[modules]
"hhplab" = "contracts"
"hhplab.analysis_geo" = "domain"
"hhplab.analyze" = "application"
"hhplab.audit_panels" = "application"
"hhplab.census_regions" = "contracts"
"hhplab.config" = "contracts"
"hhplab.coverage_diagnostics" = "application"
"hhplab.curated_migrate" = "application"
"hhplab.curated_policy" = "contracts"
"hhplab.curated_schema" = "application"
"hhplab.naming" = "contracts"
"hhplab.naming_covariates" = "contracts"
"hhplab.paths" = "contracts"
"hhplab.provenance" = "infrastructure"
"hhplab.raw_snapshot" = "infrastructure"
"hhplab.sanctuary" = "domain"
"hhplab.source_coverage" = "contracts"
"hhplab.source_registry" = "infrastructure"
"hhplab.source_urls" = "contracts"
"hhplab.sources" = "contracts"
"hhplab.status" = "application"
"hhplab.year_spec" = "contracts"

[exceptions]
# Exact upward edges present when the policy was introduced. Remove entries as
# ownership is corrected; new upward dependencies must never be added here merely
# to make the quality gate pass.
upward_edges = [
  "hhplab.sources.census.pep.pep_diagnostics -> hhplab.coverage_diagnostics",
  "hhplab.rents.zori_diagnostics -> hhplab.coverage_diagnostics",
]

[contracts.high_fan_in_modules]
# Exact internal dependencies make ownership changes reviewable. High fan-in is
# expected here; new responsibilities and dependencies are not.
"hhplab.paths" = ["hhplab.config"]
"hhplab.naming" = ["hhplab.naming_covariates", "hhplab.paths"]
"hhplab.naming_covariates" = []
"hhplab.schema.columns" = []
"hhplab.metro.metro_definitions" = ["hhplab.msa.msa_definitions"]
"hhplab.msa.msa_definitions" = []

[facades]
# These package initializers may re-export stable APIs, but implementation must
# stay in owned submodules. Lazy compatibility hooks are the only functions
# permitted directly in these files.
passive_or_reexport_only = [
  "hhplab",
  "hhplab.sources.census.acs",
  "hhplab.sources.census.census",
  "hhplab.sources.census.pep",
  "hhplab.cli",
  "hhplab.covariates",
  "hhplab.geo",
  "hhplab.metro",
  "hhplab.msa",
  "hhplab.panel",
  "hhplab.recipe",
  "hhplab.registry",
  "hhplab.schema",
  "hhplab.xwalks",
]
