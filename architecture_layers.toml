[layers]
# Higher layers may depend on lower layers. The quality gate rejects dependencies
# in the opposite direction unless the exact edge is temporarily allowlisted.
order = ["contracts", "infrastructure", "domain", "application", "interface"]

[packages]
"hhplab.cli" = "interface"

"hhplab.panel" = "application"
"hhplab.recipe" = "application"
"hhplab.results" = "application"
"hhplab.viz" = "application"

"hhplab.sources.bls" = "domain"
"hhplab.sources.cdc" = "domain"
"hhplab.sources.census" = "domain"
"hhplab.sources.mpi" = "domain"
"hhplab.covariates" = "domain"
"hhplab.geographies" = "domain"
"hhplab.measures" = "domain"
"hhplab.sources.medsl" = "domain"
"hhplab.sources.hud" = "domain"
"hhplab.sources.irs" = "domain"
"hhplab.sources.prism" = "domain"
"hhplab.sources.saiz" = "domain"
"hhplab.sources.zori" = "domain"
"hhplab.sources.vera" = "domain"
"hhplab.geographies.xwalks" = "domain"

"hhplab.registry" = "infrastructure"
"hhplab.storage" = "infrastructure"
"hhplab.artifacts" = "contracts"
"hhplab.diagnostics" = "application"

"hhplab.schema" = "contracts"

[modules]
"hhplab" = "contracts"
"hhplab.analysis_geo" = "domain"
"hhplab.analysis.analyze" = "application"
"hhplab.artifacts.curated.migrate" = "application"
"hhplab.artifacts.curated.policy" = "contracts"
"hhplab.artifacts.curated.schema" = "application"
"hhplab.artifacts.naming.naming" = "contracts"
"hhplab.artifacts.naming.covariates" = "contracts"
"hhplab.diagnostics.coverage" = "application"
"hhplab.diagnostics.status.status" = "application"
"hhplab.geographies.census.regions" = "contracts"
"hhplab.sources.coverage" = "contracts"
"hhplab.sources.doj.sanctuary" = "domain"
"hhplab.sources.urls" = "contracts"
"hhplab.storage.config" = "contracts"
"hhplab.storage.paths" = "contracts"
"hhplab.storage.provenance" = "infrastructure"
"hhplab.storage.raw_snapshot" = "infrastructure"
"hhplab.sources" = "contracts"

[exceptions]
# Exact upward edges present when the policy was introduced. Remove entries as
# ownership is corrected; new upward dependencies must never be added here merely
# to make the quality gate pass.
upward_edges = [
  "hhplab.sources.census.pep.pep_diagnostics -> hhplab.diagnostics.coverage",
  "hhplab.sources.zori.zori_diagnostics -> hhplab.diagnostics.coverage",
]

[contracts.high_fan_in_modules]
# Exact internal dependencies make ownership changes reviewable. High fan-in is
# expected here; new responsibilities and dependencies are not.
"hhplab.storage.paths" = ["hhplab.storage.config"]
"hhplab.artifacts.naming.naming" = ["hhplab.artifacts.naming.covariates", "hhplab.storage.paths"]
"hhplab.artifacts.naming.covariates" = []
"hhplab.schema.columns" = []
"hhplab.geographies.gf_metro.metro_definitions" = ["hhplab.geographies.msa.msa_definitions"]
"hhplab.geographies.msa.msa_definitions" = []

[facades]
# These package initializers may re-export stable APIs, but implementation must
# stay in owned submodules. Lazy compatibility hooks are the only functions
# permitted directly in these files.
passive_or_reexport_only = [
  "hhplab",
  "hhplab.sources.census.acs",
  "hhplab.sources.census.census",
  "hhplab.sources.census.pep",
  "hhplab.geographies",
  "hhplab.cli",
  "hhplab.covariates",
  "hhplab.geographies.coc",
  "hhplab.geographies.gf_metro",
  "hhplab.geographies.msa",
  "hhplab.panel",
  "hhplab.recipe",
  "hhplab.registry",
  "hhplab.schema",
  "hhplab.geographies.xwalks",
  "hhplab.geographies.census",
]
