# CoCs with HUD PIT counts and ACS5 terminal-year contract rents, 2010-2019,
# with rent measures stated in constant 2019 dollars.

version: 1
name: cocs_pit_contract_rent_2010_2019
description: >
  Build a CoC panel for 2010-2019 with HUD PIT total, sheltered, and
  unsheltered counts plus ACS5 terminal-year contract-rent measures. Median
  contract rent comes from B25058. First-quartile contract rent is derived
  recipe-natively by aggregating ACS5 B25056 contract-rent distribution bins
  to 2025 CoC boundaries, then linearly interpolating the 25th percentile
  within the aggregated cash-rent distribution. Rent measures are stated in
  constant 2019 dollars using BLS CPI-U annual-average adjustment.

universe:
  range: "2010-2019"

targets:
  - id: coc_pit_contract_rent_panel
    geometry: { type: coc, vintage: 2025, source: hud_exchange }
    outputs: [panel]
    panel_policy:
      inflation_adjustment:
        base_year: 2019
        columns:
          - median_contract_rent
          - first_quartile_contract_rent
        factor_column: cpi_u_adjustment_factor
      output_columns:
        - coc_id
        - coc_name
        - year
        - median_contract_rent_2019_dollars
        - first_quartile_contract_rent_2019_dollars
        - pit_total
        - pit_sheltered
        - pit_unsheltered
        - acs5_vintage_used
        - tract_vintage_used
        - cpi_u_adjustment_factor

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2010-2019"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2024
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2024.parquet

  acs5_contract_rent_tract:
    provider: census
    product: acs5
    version: 1
    native_geometry: { type: tract }
    geo_column: tract_geoid
    file_set:
      path_template: "data/curated/acs/acs5_tracts__A{acs_end}xT{tract}.parquet"
      segments:
        - years: "2010-2019"
          geometry: { type: tract, vintage: 2010, source: tiger }
          constants: { tract: 2010 }
          year_offsets: { acs_end: 0 }

transforms:
  - id: tract2010_to_coc_area
    type: crosswalk
    from: { type: tract, vintage: 2010, source: tiger }
    to: { type: coc, vintage: 2025, source: hud_exchange }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_coc_pit_contract_rent_panel
    target: coc_pit_contract_rent_panel
    steps:
      - materialize:
          transforms:
            - tract2010_to_coc_area

      - resample:
          dataset: pit
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: identity
          measures: [pit_total, pit_sheltered, pit_unsheltered]

      - resample:
          dataset: acs5_contract_rent_tract
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: aggregate
          transform_set:
            segments:
              - years: "2010-2019"
                via: tract2010_to_coc_area
          measures:
            median_contract_rent: { aggregation: weighted_mean }
            contract_rent_distribution_with_cash_rent: { aggregation: sum }
          derived_measures:
            first_quartile_contract_rent:
              type: quantile_from_distribution
              distribution_family: contract_rent
              quantile: 0.25

      - join:
          datasets: [pit, acs5_contract_rent_tract]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
