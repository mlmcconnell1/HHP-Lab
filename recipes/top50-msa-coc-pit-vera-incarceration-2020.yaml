# Top 50 2020-population Census MSAs with CoC PIT and Vera incarceration trends.

version: 1
name: top50_msa_coc_pit_vera_incarceration_2020
description: >
  Build a 2020 Census MSA panel for the 50 largest MSAs by 2020 county PEP
  population. CoC-native HUD PIT counts are rolled up to Census MSAs, while
  Vera county jail count and denominator columns are aggregated from
  county-native artifacts to the same MSA geography. County prison columns are
  intentionally omitted because Vera's county prison series ends before 2020.

universe:
  years: [2020]

targets:
  - id: msa_panel
    geometry: { type: msa, source: census_msa_2023 }
    cohort:
      rank_by: population
      method: top_n
      n: 50
      reference_year: 2020
    outputs: [panel]

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2020-2020"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2020
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2020.parquet

  pep_county:
    provider: census
    product: pep
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    path: data/curated/pep/pep_county__v2025__y2020-2025.parquet

  vera_incarceration:
    provider: vera
    product: incarceration_trends
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    params:
      align: calendar_year
    path: data/curated/vera/vera_incarceration_county__Y1970-2026@C2020.parquet

transforms:
  - id: coc_to_msa_area
    type: crosswalk
    from: { type: coc, vintage: 2020, source: hud_exchange }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county2020_to_msa_area
    type: crosswalk
    from: { type: county, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_msa_panel
    target: msa_panel
    steps:
      - materialize:
          transforms: [coc_to_msa_area, county2020_to_msa_area]

      - resample:
          dataset: pit
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: coc_to_msa_area
          measures:
            pit_total: { aggregation: sum }
            pit_sheltered: { aggregation: sum }
            pit_unsheltered: { aggregation: sum }

      - resample:
          dataset: pep_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2020_to_msa_area
          measures:
            population: { aggregation: sum }

      - resample:
          dataset: vera_incarceration
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2020_to_msa_area
          measures:
            total_jail_pop: { aggregation: sum }
            male_jail_pop: { aggregation: sum }
            female_jail_pop: { aggregation: sum }
            total_pretrial_custody: { aggregation: sum }
            total_sentenced_custody: { aggregation: sum }
            total_jail_admits: { aggregation: sum }
            total_jail_discharges: { aggregation: sum }
            jail_rated_capacity: { aggregation: sum }
            total_pop_15to64: { aggregation: sum }
          derived_measures:
            jail_population_per_15to64:
              type: rate_from_weighted_counts
              source_numerator_column: total_jail_pop
              denominator_column: total_pop_15to64

      - join:
          datasets: [pit, pep_county, vera_incarceration]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
