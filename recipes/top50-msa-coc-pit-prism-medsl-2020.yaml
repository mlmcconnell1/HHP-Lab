# Top 50 2020-population Census MSAs with CoC PIT, PRISM January tmin,
# and MEDSL presidential vote counts.

version: 1
name: top50_msa_coc_pit_prism_medsl_2020
description: >
  Build a 2020 Census MSA panel for the 50 largest MSAs by 2020 county PEP
  population. CoC-native HUD PIT counts are rolled up to Census MSAs, while
  January PRISM minimum temperature and MEDSL 2020 presidential vote counts are
  aggregated from county-native artifacts to the same MSA geography.

universe:
  years: [2020]

targets:
  - id: msa_panel
    geometry: { type: msa, source: census_msa_2023 }
    cohort:
      rank_by: population
      method: top_n
      n: 50
      reference_year: 2020
    outputs: [panel]

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2020-2020"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2020
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2020.parquet

  pep_county:
    provider: census
    product: pep
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    path: data/curated/pep/pep_county__v2025__y2020-2025.parquet

  prism_tmin_county:
    provider: prism
    product: temperature
    version: 1
    native_geometry: { type: county, vintage: 2023 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    params:
      variable: tmin
      month: 1
      align: point_in_time_jan
    path: data/curated/prism/prism_county_monthly__tmin__Y2020M01@C2023.parquet

  medsl_president:
    provider: medsl
    product: president
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    params:
      align: presidential_election_year
    path: data/curated/medsl/medsl_president_county__Y2000-2024@C2020.parquet

transforms:
  - id: coc_to_msa_area
    type: crosswalk
    from: { type: coc, vintage: 2020, source: hud_exchange }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county2020_to_msa_area
    type: crosswalk
    from: { type: county, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county2023_to_msa_area
    type: crosswalk
    from: { type: county, vintage: 2023 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_msa_panel
    target: msa_panel
    steps:
      - materialize:
          transforms: [coc_to_msa_area, county2020_to_msa_area, county2023_to_msa_area]

      - resample:
          dataset: pit
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: coc_to_msa_area
          measures:
            pit_total: { aggregation: sum }
            pit_sheltered: { aggregation: sum }
            pit_unsheltered: { aggregation: sum }

      - resample:
          dataset: pep_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2020_to_msa_area
          measures:
            population: { aggregation: sum }

      - resample:
          dataset: prism_tmin_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2023_to_msa_area
          measures:
            tmin_c: { aggregation: weighted_mean }

      - resample:
          dataset: medsl_president
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2020_to_msa_area
          measures:
            democratic_votes: { aggregation: sum }
            republican_votes: { aggregation: sum }
            two_party_votes: { aggregation: sum }
            totalvotes: { aggregation: sum }
          derived_measures:
            democratic_vote_share:
              type: rate_from_weighted_counts
              source_numerator_column: democratic_votes
              denominator_column: totalvotes
            republican_vote_share:
              type: rate_from_weighted_counts
              source_numerator_column: republican_votes
              denominator_column: totalvotes
            democratic_republican_vote_ratio:
              type: rate_from_weighted_counts
              source_numerator_column: democratic_votes
              denominator_column: republican_votes

      - join:
          datasets: [pit, pep_county, prism_tmin_county, medsl_president]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
