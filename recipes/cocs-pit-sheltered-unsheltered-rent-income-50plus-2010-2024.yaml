# All CoCs with HUD PIT sheltered/unsheltered counts and ACS5 terminal-year
# gross-rent-as-percentage-of-income burden at 50% or more, 2010-2024.

version: 1
name: cocs_pit_sheltered_unsheltered_rent_income_50plus_2010_2024
description: >
  Build an all-CoC panel for 2010-2024 with HUD PIT total, sheltered, and
  unsheltered counts plus the ACS5 terminal-vintage share of households paying
  50% or more of household income on gross rent. ACS5 gross-rent income bins
  use the ACS vintage ending in the panel year and the tract vintage appropriate
  to that source year, then area-weight to 2025 CoC boundaries.

universe:
  range: "2010-2024"

targets:
  - id: coc_pit_rent_income_panel
    geometry: { type: coc, vintage: 2025, source: hud_exchange }
    outputs: [panel]
    panel_policy:
      output_columns:
        - coc_id
        - coc_name
        - year
        - pit_total
        - pit_sheltered
        - pit_unsheltered
        - gross_rent_pct_income_total
        - households_gross_rent_income_50plus
        - gross_rent_income_pct_50plus
        - acs5_vintage_used
        - tract_vintage_used

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2010-2024"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2024
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2024.parquet

  acs5_rent_income_tract:
    provider: census
    product: acs5
    version: 1
    native_geometry: { type: tract }
    geo_column: tract_geoid
    file_set:
      path_template: "data/curated/acs/acs5_tracts__A{acs_end}xT{tract}.parquet"
      segments:
        - years: "2010-2019"
          geometry: { type: tract, vintage: 2010, source: tiger }
          constants: { tract: 2010 }
          year_offsets: { acs_end: 0 }
        - years: "2020-2024"
          geometry: { type: tract, vintage: 2020, source: tiger }
          constants: { tract: 2020 }
          year_offsets: { acs_end: 0 }

transforms:
  - id: tract2010_to_coc_area
    type: crosswalk
    from: { type: tract, vintage: 2010, source: tiger }
    to: { type: coc, vintage: 2025, source: hud_exchange }
    spec:
      weighting:
        scheme: area

  - id: tract2020_to_coc_area
    type: crosswalk
    from: { type: tract, vintage: 2020, source: tiger }
    to: { type: coc, vintage: 2025, source: hud_exchange }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_coc_pit_rent_income_panel
    target: coc_pit_rent_income_panel
    steps:
      - materialize:
          transforms:
            - tract2010_to_coc_area
            - tract2020_to_coc_area

      - resample:
          dataset: pit
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: identity
          measures: [pit_total, pit_sheltered, pit_unsheltered]

      - resample:
          dataset: acs5_rent_income_tract
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: aggregate
          transform_set:
            segments:
              - years: "2010-2019"
                via: tract2010_to_coc_area
              - years: "2020-2024"
                via: tract2020_to_coc_area
          measures:
            gross_rent_pct_income_total: { aggregation: sum }
          derived_measures:
            gross_rent_income_pct_50plus:
              type: rate_from_weighted_counts
              source_numerator_columns:
                - gross_rent_pct_income_50_plus
              denominator_column: gross_rent_pct_income_total
              numerator_output_column: households_gross_rent_income_50plus

      - join:
          datasets: [pit, acs5_rent_income_tract]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
