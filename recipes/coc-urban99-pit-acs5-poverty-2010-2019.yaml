# CoCs whose 2020 decennial urban population fraction is at least 0.99.
# Builds a 2010-2019 CoC panel with PIT sheltered/unsheltered counts and
# terminal-year ACS5 tract population and poverty counts.

version: 1
name: coc_urban99_pit_acs5_poverty_2010_2019
description: >
  Build a 2010-2019 CoC panel for every CoC whose static 2020 urban
  population fraction is at least 0.99. The urban-fraction selector is read
  from the B2020_non_pr/U2020/K2020 artifact and broadcast across all panel
  years. PIT sheltered and unsheltered counts come from the 2024 PIT vintage.
  ACS5 total population and persons below poverty use the terminal ACS5 year
  matching the panel year and are aggregated from 2010-era tracts to 2025 CoC
  boundaries.

universe:
  range: "2010-2019"

targets:
  - id: urban99_coc_panel
    geometry: { type: coc, vintage: 2025, source: hud_exchange }
    outputs: [panel]
    cohort:
      rank_by: urban_population_fraction
      method: predicate
      operator: gte
      value: 0.99
      reference_year: 2010

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2010-2019"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2024
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2024.parquet

  acs5_tract:
    provider: census
    product: acs5
    version: 1
    native_geometry: { type: tract, vintage: 2010, source: tiger }
    geo_column: tract_geoid
    file_set:
      path_template: "data/curated/acs/acs5_tracts__A{acs_end}xT{tract}.parquet"
      segments:
        - years: "2010-2019"
          geometry: { type: tract, vintage: 2010, source: tiger }
          constants: { tract: 2010 }
          year_offsets: { acs_end: 0 }

  urban_fraction:
    provider: census
    product: urban_fraction
    version: 1
    native_geometry: { type: coc, vintage: 2025, source: hud_exchange }
    years: "2010-2019"
    geo_column: coc_id
    params:
      boundary_vintage: 2020_non_pr
      decennial_vintage: 2020
      urban_area_vintage: 2020
      block_vintage: 2020
      broadcast_static: true
    path: data/curated/measures/coc_urban_fraction__N2020@B2020_non_prxU2020xK2020.parquet

transforms:
  - id: tract2010_to_coc2025_area
    type: crosswalk
    from: { type: tract, vintage: 2010, source: tiger }
    to: { type: coc, vintage: 2025, source: hud_exchange }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_urban99_coc_panel
    target: urban99_coc_panel
    steps:
      - materialize:
          transforms: [tract2010_to_coc2025_area]

      - resample:
          dataset: pit
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: identity
          measures: [pit_total, pit_sheltered, pit_unsheltered]

      - resample:
          dataset: acs5_tract
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: aggregate
          via: tract2010_to_coc2025_area
          measures:
            total_population: { aggregation: sum }
            population_below_poverty: { aggregation: sum }

      - resample:
          dataset: urban_fraction
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: identity
          measures:
            urban_population_fraction: { aggregation: mean }

      - join:
          datasets: [pit, acs5_tract, urban_fraction]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
