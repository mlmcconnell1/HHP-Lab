# Top 50 2020-population Census MSAs with CoC PIT and lagged ACS5 income.

version: 1
name: top50_msa_coc_pit_acs5_income_2020
description: >
  Build a 2020 Census MSA panel for the 50 largest MSAs by 2020 county PEP
  population. CoC-native HUD PIT counts are rolled up to Census MSAs, and
  lagged ACS5 2019 tract income covariates are aggregated to the same MSA
  geography. The ACS lag follows the project convention for PIT panels:
  ACS vintage = PIT year - 1.

universe:
  years: [2020]

targets:
  - id: msa_panel
    geometry: { type: msa, source: census_msa_2023 }
    cohort:
      rank_by: population
      method: top_n
      n: 50
      reference_year: 2020
    outputs: [panel]

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2020-2020"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2020
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2020.parquet

  pep_county:
    provider: census
    product: pep
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    path: data/curated/pep/pep_county__v2025__y2020-2025.parquet

  acs5_income_tract:
    provider: census
    product: acs5
    version: 1
    native_geometry: { type: tract }
    geo_column: tract_geoid
    file_set:
      path_template: "data/curated/acs/acs5_tracts__A{acs_end}xT{tract}.parquet"
      segments:
        - years: "2020-2020"
          geometry: { type: tract, vintage: 2010, source: tiger }
          constants: { tract: 2010 }
          year_offsets: { acs_end: -1 }

transforms:
  - id: coc_to_msa_area
    type: crosswalk
    from: { type: coc, vintage: 2020, source: hud_exchange }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county2020_to_msa_area
    type: crosswalk
    from: { type: county, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: tract2010_to_msa_area
    type: crosswalk
    from: { type: tract, vintage: 2010, source: tiger }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_msa_panel
    target: msa_panel
    steps:
      - materialize:
          transforms: [coc_to_msa_area, county2020_to_msa_area, tract2010_to_msa_area]

      - resample:
          dataset: pit
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: coc_to_msa_area
          measures:
            pit_total: { aggregation: sum }
            pit_sheltered: { aggregation: sum }
            pit_unsheltered: { aggregation: sum }

      - resample:
          dataset: pep_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2020_to_msa_area
          measures:
            population: { aggregation: sum }

      - resample:
          dataset: acs5_income_tract
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: tract2010_to_msa_area
          measures:
            median_household_income: { aggregation: weighted_mean }
            gini_index: { aggregation: weighted_mean }
            household_income_total: { aggregation: sum }
          derived_measures:
            household_income_pct_gt_200000:
              type: rate_from_weighted_counts
              source_numerator_columns:
                - household_income_200000_plus
              denominator_column: household_income_total
              numerator_output_column: households_income_gt_200000

      - join:
          datasets: [pit, pep_county, acs5_income_tract]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
