# All CoCs with HUD PIT sheltered/unsheltered counts and ACS5 terminal-year
# housing units per population, 2010-2024.

version: 1
name: cocs_pit_sheltered_unsheltered_housing_units_per_population_2010_2024
description: >
  Build an all-CoC panel for 2010-2024 with HUD PIT total, sheltered, and
  unsheltered counts plus ACS5 terminal-vintage total housing units and total
  population. ACS5 tract counts use the ACS vintage ending in the panel year
  and the tract vintage appropriate to that source year, then area-weight to
  2025 CoC boundaries before deriving housing units per population.

universe:
  range: "2010-2024"

targets:
  - id: coc_pit_housing_units_population_panel
    geometry: { type: coc, vintage: 2025, source: hud_exchange }
    outputs: [panel]
    panel_policy:
      output_columns:
        - coc_id
        - coc_name
        - year
        - pit_total
        - pit_sheltered
        - pit_unsheltered
        - total_housing_units
        - total_population
        - housing_units_per_population
        - acs5_vintage_used
        - tract_vintage_used

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2010-2024"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2024
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2024.parquet

  acs5_housing_population_tract:
    provider: census
    product: acs5
    version: 1
    native_geometry: { type: tract }
    geo_column: tract_geoid
    file_set:
      path_template: "data/curated/acs/acs5_tracts__A{acs_end}xT{tract}.parquet"
      segments:
        - years: "2010-2019"
          geometry: { type: tract, vintage: 2010, source: tiger }
          constants: { tract: 2010 }
          year_offsets: { acs_end: 0 }
        - years: "2020-2024"
          geometry: { type: tract, vintage: 2020, source: tiger }
          constants: { tract: 2020 }
          year_offsets: { acs_end: 0 }

transforms:
  - id: tract2010_to_coc_area
    type: crosswalk
    from: { type: tract, vintage: 2010, source: tiger }
    to: { type: coc, vintage: 2025, source: hud_exchange }
    spec:
      weighting:
        scheme: area

  - id: tract2020_to_coc_area
    type: crosswalk
    from: { type: tract, vintage: 2020, source: tiger }
    to: { type: coc, vintage: 2025, source: hud_exchange }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_coc_pit_housing_units_population_panel
    target: coc_pit_housing_units_population_panel
    steps:
      - materialize:
          transforms:
            - tract2010_to_coc_area
            - tract2020_to_coc_area

      - resample:
          dataset: pit
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: identity
          measures: [pit_total, pit_sheltered, pit_unsheltered]

      - resample:
          dataset: acs5_housing_population_tract
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: aggregate
          transform_set:
            segments:
              - years: "2010-2019"
                via: tract2010_to_coc_area
              - years: "2020-2024"
                via: tract2020_to_coc_area
          measures:
            total_housing_units: { aggregation: sum }
            total_population: { aggregation: sum }
          derived_measures:
            housing_units_per_population:
              type: rate_from_weighted_counts
              source_numerator_column: total_housing_units
              denominator_column: total_population

      - join:
          datasets: [pit, acs5_housing_population_tract]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
