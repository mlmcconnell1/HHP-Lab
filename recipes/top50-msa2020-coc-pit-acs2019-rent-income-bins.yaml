# Top 50 2020-population Census MSAs with CoC PIT rollup and ACS2019 bins.

version: 1
name: top50_msa2020_coc_pit_acs2019_rent_income_bins
description: >
  Build a 2020 Census MSA panel for the 50 largest MSAs by 2020 Census
  population. The base panel is the existing 2020-vintage CoC PIT rollup to
  Census MSAs using 2020 CoC boundaries and 2020 block-population allocation.
  Lagged ACS5 2019 tract contract-rent and household-income distribution bins
  are aggregated to the same Census MSA 2023 geography. January PRISM minimum
  temperature and MEDSL 2020 presidential vote counts are aggregated from
  county-native artifacts.

universe:
  years: [2020]

targets:
  - id: msa_panel
    geometry: { type: msa, source: census_msa_2023 }
    cohort:
      rank_by: msa_2020_census_population
      method: top_n
      n: 50
      reference_year: 2020
    outputs: [panel]
    panel_policy:
      source_label: top50_msa2020_coc_pit_acs2019_rent_income_bins
      output_columns:
        - geo_type
        - geo_id
        - msa_id
        - msa_name
        - cbsa_code
        - year
        - msa_population_rank_2020_census
        - msa_2020_census_population
        - pit_total
        - pit_sheltered
        - pit_unsheltered
        - tmin_c
        - democratic_votes
        - republican_votes
        - two_party_votes
        - totalvotes
        - democratic_republican_vote_ratio
        - coc_count
        - covered_coc_count
        - missing_coc_count
        - missing_cocs
        - coc_population_coverage_ratio
        - msa_population_coverage_ratio
        - allocation_share_sum
        - expected_allocation_share_sum
        - unmapped_source_coc_count
        - unmapped_source_cocs
        - unmapped_source_additive_measure_totals
        - allocation_basis
        - denominator_source
        - boundary_vintage
        - county_vintage
        - block_vintage
        - decennial_vintage
        - msa_definition_version
        - contract_rent_distribution_total
        - contract_rent_distribution_with_cash_rent
        - contract_rent_distribution_cash_rent_lt_100
        - contract_rent_distribution_cash_rent_100_to_149
        - contract_rent_distribution_cash_rent_150_to_199
        - contract_rent_distribution_cash_rent_200_to_249
        - contract_rent_distribution_cash_rent_250_to_299
        - contract_rent_distribution_cash_rent_300_to_349
        - contract_rent_distribution_cash_rent_350_to_399
        - contract_rent_distribution_cash_rent_400_to_449
        - contract_rent_distribution_cash_rent_450_to_499
        - contract_rent_distribution_cash_rent_500_to_549
        - contract_rent_distribution_cash_rent_550_to_599
        - contract_rent_distribution_cash_rent_600_to_649
        - contract_rent_distribution_cash_rent_650_to_699
        - contract_rent_distribution_cash_rent_700_to_749
        - contract_rent_distribution_cash_rent_750_to_799
        - contract_rent_distribution_cash_rent_800_to_899
        - contract_rent_distribution_cash_rent_900_to_999
        - contract_rent_distribution_cash_rent_1000_to_1249
        - contract_rent_distribution_cash_rent_1250_to_1499
        - contract_rent_distribution_cash_rent_1500_to_1999
        - contract_rent_distribution_cash_rent_2000_to_2499
        - contract_rent_distribution_cash_rent_2500_to_2999
        - contract_rent_distribution_cash_rent_3000_to_3499
        - contract_rent_distribution_cash_rent_3500_plus
        - contract_rent_distribution_no_cash_rent
        - household_income_total
        - household_income_lt_10000
        - household_income_10000_to_14999
        - household_income_15000_to_19999
        - household_income_20000_to_24999
        - household_income_25000_to_29999
        - household_income_30000_to_34999
        - household_income_35000_to_39999
        - household_income_40000_to_44999
        - household_income_45000_to_49999
        - household_income_50000_to_59999
        - household_income_60000_to_74999
        - household_income_75000_to_99999
        - household_income_100000_to_124999
        - household_income_125000_to_149999
        - household_income_150000_to_199999
        - household_income_200000_plus
        - source

datasets:
  msa_pit_rollup:
    provider: hhplab
    product: msa_pit_rollup
    version: 1
    native_geometry: { type: msa, source: census_msa_2023 }
    years: "2020-2020"
    year_column: year
    geo_column: msa_id
    path: outputs/top50_msa2020_census_coc2020_pit_population_rollup_pit2020_vintage/panel__top50_msa2020_census_coc2020_pit_population_rollup_pit2020_vintage__Y2020@B2020_Dcensus_msa_2023.parquet

  acs5_contract_rent_bins_tract:
    provider: census
    product: acs5_contract_rent_bins
    version: 1
    native_geometry: { type: tract, vintage: 2010, source: tiger }
    years: "2020-2020"
    geo_column: tract_geoid
    path: data/curated/acs_contract_rent_cache/acs5_contract_rent_tracts__A2019.parquet

  acs5_household_income_bins_tract:
    provider: census
    product: acs5_household_income_bins
    version: 1
    native_geometry: { type: tract, vintage: 2010, source: tiger }
    years: "2020-2020"
    geo_column: tract_geoid
    path: data/curated/acs/acs5_tracts__A2019xT2010.parquet

  prism_tmin_county:
    provider: prism
    product: temperature
    version: 1
    native_geometry: { type: county, vintage: 2023 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    params:
      variable: tmin
      month: 1
      align: point_in_time_jan
    path: data/curated/prism/prism_county_monthly__tmin__Y2020M01@C2023.parquet

  medsl_president:
    provider: medsl
    product: president
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    params:
      align: presidential_election_year
    path: data/curated/medsl/medsl_president_county__Y2000-2024@C2020.parquet

transforms:
  - id: tract2010_to_msa_area
    type: crosswalk
    from: { type: tract, vintage: 2010, source: tiger }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county2020_to_msa_area
    type: crosswalk
    from: { type: county, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county2023_to_msa_area
    type: crosswalk
    from: { type: county, vintage: 2023 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_msa_panel
    target: msa_panel
    steps:
      - materialize:
          transforms: [tract2010_to_msa_area, county2020_to_msa_area, county2023_to_msa_area]

      - resample:
          dataset: msa_pit_rollup
          to_geometry: { type: msa, source: census_msa_2023 }
          method: identity
          measures:
            - cbsa_code
            - msa_name
            - msa_population_rank_2020_census
            - msa_2020_census_population
            - pit_total
            - pit_sheltered
            - pit_unsheltered
            - coc_count
            - covered_coc_count
            - missing_coc_count
            - missing_cocs
            - coc_population_coverage_ratio
            - msa_population_coverage_ratio
            - allocation_share_sum
            - expected_allocation_share_sum
            - unmapped_source_coc_count
            - unmapped_source_cocs
            - unmapped_source_additive_measure_totals
            - allocation_basis
            - denominator_source
            - boundary_vintage
            - county_vintage
            - block_vintage
            - decennial_vintage
            - msa_definition_version
            - source

      - resample:
          dataset: acs5_contract_rent_bins_tract
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: tract2010_to_msa_area
          measures:
            contract_rent_distribution_total: { aggregation: sum }
            contract_rent_distribution_with_cash_rent: { aggregation: sum }
            contract_rent_distribution_cash_rent_lt_100: { aggregation: sum }
            contract_rent_distribution_cash_rent_100_to_149: { aggregation: sum }
            contract_rent_distribution_cash_rent_150_to_199: { aggregation: sum }
            contract_rent_distribution_cash_rent_200_to_249: { aggregation: sum }
            contract_rent_distribution_cash_rent_250_to_299: { aggregation: sum }
            contract_rent_distribution_cash_rent_300_to_349: { aggregation: sum }
            contract_rent_distribution_cash_rent_350_to_399: { aggregation: sum }
            contract_rent_distribution_cash_rent_400_to_449: { aggregation: sum }
            contract_rent_distribution_cash_rent_450_to_499: { aggregation: sum }
            contract_rent_distribution_cash_rent_500_to_549: { aggregation: sum }
            contract_rent_distribution_cash_rent_550_to_599: { aggregation: sum }
            contract_rent_distribution_cash_rent_600_to_649: { aggregation: sum }
            contract_rent_distribution_cash_rent_650_to_699: { aggregation: sum }
            contract_rent_distribution_cash_rent_700_to_749: { aggregation: sum }
            contract_rent_distribution_cash_rent_750_to_799: { aggregation: sum }
            contract_rent_distribution_cash_rent_800_to_899: { aggregation: sum }
            contract_rent_distribution_cash_rent_900_to_999: { aggregation: sum }
            contract_rent_distribution_cash_rent_1000_to_1249: { aggregation: sum }
            contract_rent_distribution_cash_rent_1250_to_1499: { aggregation: sum }
            contract_rent_distribution_cash_rent_1500_to_1999: { aggregation: sum }
            contract_rent_distribution_cash_rent_2000_to_2499: { aggregation: sum }
            contract_rent_distribution_cash_rent_2500_to_2999: { aggregation: sum }
            contract_rent_distribution_cash_rent_3000_to_3499: { aggregation: sum }
            contract_rent_distribution_cash_rent_3500_plus: { aggregation: sum }
            contract_rent_distribution_no_cash_rent: { aggregation: sum }

      - resample:
          dataset: acs5_household_income_bins_tract
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: tract2010_to_msa_area
          measures:
            household_income_total: { aggregation: sum }
            household_income_lt_10000: { aggregation: sum }
            household_income_10000_to_14999: { aggregation: sum }
            household_income_15000_to_19999: { aggregation: sum }
            household_income_20000_to_24999: { aggregation: sum }
            household_income_25000_to_29999: { aggregation: sum }
            household_income_30000_to_34999: { aggregation: sum }
            household_income_35000_to_39999: { aggregation: sum }
            household_income_40000_to_44999: { aggregation: sum }
            household_income_45000_to_49999: { aggregation: sum }
            household_income_50000_to_59999: { aggregation: sum }
            household_income_60000_to_74999: { aggregation: sum }
            household_income_75000_to_99999: { aggregation: sum }
            household_income_100000_to_124999: { aggregation: sum }
            household_income_125000_to_149999: { aggregation: sum }
            household_income_150000_to_199999: { aggregation: sum }
            household_income_200000_plus: { aggregation: sum }

      - resample:
          dataset: prism_tmin_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2023_to_msa_area
          measures:
            tmin_c: { aggregation: weighted_mean }

      - resample:
          dataset: medsl_president
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2020_to_msa_area
          measures:
            democratic_votes: { aggregation: sum }
            republican_votes: { aggregation: sum }
            two_party_votes: { aggregation: sum }
            totalvotes: { aggregation: sum }
          derived_measures:
            democratic_republican_vote_ratio:
              type: rate_from_weighted_counts
              source_numerator_column: democratic_votes
              denominator_column: republican_votes

      - join:
          datasets:
            - msa_pit_rollup
            - acs5_contract_rent_bins_tract
            - acs5_household_income_bins_tract
            - prism_tmin_county
            - medsl_president
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
