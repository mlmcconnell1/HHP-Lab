# Top 50 2020-population Census MSAs with CoC PIT, HIC, rent, and income quantiles.

version: 1
name: top50_msa_coc_pit_hic_rent_income_quantiles_2020
description: >
  Build a 2020 Census MSA panel for the 50 largest MSAs by 2020 county PEP
  population. CoC-native HUD PIT counts and HIC inventory measures are rolled
  up to Census MSAs. ACS5 terminal-year 2020 MSA-native contract-rent and
  household-income distribution bins are linearly interpolated to derive
  bottom-decile, bottom-quartile, top-quartile, and top-decile rent and
  household-income measures.

universe:
  years: [2020]

targets:
  - id: msa_panel
    geometry: { type: msa, source: census_msa_2023 }
    cohort:
      rank_by: population
      method: top_n
      n: 50
      reference_year: 2020
    outputs: [panel]
    panel_policy:
      output_columns:
        - geo_id
        - msa_name
        - year
        - population
        - pit_total
        - pit_sheltered
        - pit_unsheltered
        - hic_es_year_round_beds
        - hic_th_year_round_beds
        - hic_sh_year_round_beds
        - hic_rrh_year_round_beds
        - hic_psh_year_round_beds
        - hic_oph_year_round_beds
        - bottom_decile_contract_rent
        - bottom_quartile_contract_rent
        - top_quartile_contract_rent
        - top_decile_contract_rent
        - bottom_decile_household_income
        - bottom_quartile_household_income
        - top_quartile_household_income
        - top_decile_household_income

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2020-2020"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2020
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2020.parquet

  hic:
    provider: hud
    product: hic
    version: 1
    native_geometry: { type: coc }
    years: "2020-2020"
    year_column: hic_year
    geo_column: coc_id
    params:
      align: point_in_time_jan
    file_set:
      path_template: "data/curated/hic/hic__H{year}.parquet"
      segments:
        - years: "2020-2020"
          geometry: { type: coc, source: hud_exchange }

  pep_county:
    provider: census
    product: pep
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2020-2020"
    year_column: year
    geo_column: county_fips
    path: data/curated/pep/pep_county__v2025__y2020-2025.parquet

  acs5_msa_rent_income:
    provider: census
    product: acs5
    version: 1
    native_geometry: { type: msa, source: census_msa_2023 }
    years: "2020-2020"
    year_column: year
    geo_column: msa_id
    path: data/curated/measures/measures__metro__A2020@Dcensusmsa2023.parquet

transforms:
  - id: coc_to_msa_area
    type: crosswalk
    from: { type: coc, vintage: 2020, source: hud_exchange }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county2020_to_msa_area
    type: crosswalk
    from: { type: county, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_msa_panel
    target: msa_panel
    steps:
      - materialize:
          transforms: [coc_to_msa_area, county2020_to_msa_area]

      - resample:
          dataset: pit
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: coc_to_msa_area
          measures:
            pit_total: { aggregation: sum }
            pit_sheltered: { aggregation: sum }
            pit_unsheltered: { aggregation: sum }

      - resample:
          dataset: hic
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: coc_to_msa_area
          measures:
            hic_es_year_round_beds: { aggregation: sum }
            hic_th_year_round_beds: { aggregation: sum }
            hic_sh_year_round_beds: { aggregation: sum }
            hic_rrh_year_round_beds: { aggregation: sum }
            hic_psh_year_round_beds: { aggregation: sum }
            hic_oph_year_round_beds: { aggregation: sum }

      - resample:
          dataset: pep_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county2020_to_msa_area
          measures:
            population: { aggregation: sum }

      - resample:
          dataset: acs5_msa_rent_income
          to_geometry: { type: msa, source: census_msa_2023 }
          method: identity
          measures:
            contract_rent_distribution_with_cash_rent: { aggregation: sum }
            household_income_total: { aggregation: sum }
          derived_measures:
            bottom_decile_contract_rent:
              type: quantile_from_distribution
              distribution_family: contract_rent
              quantile: 0.10
            bottom_quartile_contract_rent:
              type: quantile_from_distribution
              distribution_family: contract_rent
              quantile: 0.25
            top_quartile_contract_rent:
              type: quantile_from_distribution
              distribution_family: contract_rent
              quantile: 0.75
            top_decile_contract_rent:
              type: quantile_from_distribution
              distribution_family: contract_rent
              quantile: 0.90
            bottom_decile_household_income:
              type: quantile_from_distribution
              distribution_family: household_income
              quantile: 0.10
            bottom_quartile_household_income:
              type: quantile_from_distribution
              distribution_family: household_income
              quantile: 0.25
            top_quartile_household_income:
              type: quantile_from_distribution
              distribution_family: household_income
              quantile: 0.75
            top_decile_household_income:
              type: quantile_from_distribution
              distribution_family: household_income
              quantile: 0.90

      - join:
          datasets: [pit, hic, pep_county, acs5_msa_rent_income]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
