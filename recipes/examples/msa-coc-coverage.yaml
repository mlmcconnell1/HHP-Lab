# Example recipe: top-100 MSA/CoC overlap coverage by area and ACS5 population.
# Run preflight before build:
#   HHPLAB_NON_INTERACTIVE=1 hhplab build recipe-preflight --recipe recipes/examples/msa-coc-coverage.yaml --json
# Inspect canonical output paths and denominator settings:
#   HHPLAB_NON_INTERACTIVE=1 hhplab build recipe-plan --recipe recipes/examples/msa-coc-coverage.yaml --json
# Expected coverage output:
#   outputs/msa_coc_coverage_2024/msa_coc_coverage__Y2024@B2025xMcensus_msa_2023xC2023__top100__basis-area-population.parquet

version: 1
name: msa_coc_coverage_2024
description: >
  Build a recipe-native MSA-CoC overlap coverage artifact for the top 100
  Census MSAs, with both geometry-area and ACS5 tract total_population
  denominator rows.

universe:
  years: [2024]

targets:
  - id: top100_msa_coc_coverage
    geometry: { type: coc, vintage: 2025 }
    outputs: [msa_coc_coverage]
    msa_coc_coverage:
      year: 2024
      top_n: 100
      ranking_population_source: pep
      ranking_reference_year: 2024
      coc_boundary_vintage: 2025
      msa_definition_version: census_msa_2023
      county_vintage: 2023
      overlap_bases: [area, population]
      acs5_population_vintage: 2023
      acs5_population_reference_year: 2023
      tract_vintage: 2020
      min_msa_area_coverage_share: 0.0
      min_msa_population_coverage_share: 0.0
      csv_sidecar: true

datasets:
  pep_msa:
    provider: census
    product: pep
    version: 1
    native_geometry: { type: msa, source: census_msa_2023 }
    years:
      years: [2024]
    year_column: year
    geo_column: msa_id
    path: data/curated/pep/pep__msa__Y2024@Mcensusmsa2023xC2023__wpopulation.parquet

transforms: []

pipelines:
  - id: build_msa_coc_coverage
    target: top100_msa_coc_coverage
    steps:
      - resample:
          dataset: pep_msa
          to_geometry: { type: msa, source: census_msa_2023 }
          method: identity
          measures: [population]
