# Example recipe: January PRISM county temperature to CoC and MSA panels.
# Uses pre-materialized PRISM county monthly artifacts and weighted means.

version: 1
name: coc_msa_prism_tmin_january_2024
description: >
  Build CoC and Census MSA panels with January PRISM minimum temperature
  aggregated from county-native monthly artifacts using weighted_mean.

universe:
  years: [2024]

targets:
  - id: coc_panel
    geometry: { type: coc, vintage: 2025, source: hud_exchange }
    outputs: [panel]
  - id: msa_panel
    geometry: { type: msa, source: census_msa_2023 }
    outputs: [panel]

datasets:
  prism_tmin_county:
    provider: prism
    product: temperature
    version: 1
    native_geometry: { type: county, vintage: 2023 }
    years: "2024-2024"
    year_column: year
    geo_column: county_fips
    params:
      variable: tmin
      month: 1
      align: point_in_time_jan
    path: data/curated/prism/prism_county_monthly__tmin__Y2024M01@C2023.parquet

transforms:
  - id: county_to_coc_population
    type: crosswalk
    from: { type: county, vintage: 2023 }
    to: { type: coc, vintage: 2025, source: hud_exchange }
    spec:
      weighting:
        scheme: tract_mediated
        variety: population
        tract_vintage: 2020
        acs_vintage: 2023

  - id: county_to_msa_population
    type: crosswalk
    from: { type: county, vintage: 2023 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_coc_panel
    target: coc_panel
    steps:
      - materialize:
          transforms: [county_to_coc_population]

      - resample:
          dataset: prism_tmin_county
          to_geometry: { type: coc, vintage: 2025, source: hud_exchange }
          method: aggregate
          via: county_to_coc_population
          measures:
            tmin_c: { aggregation: weighted_mean }

      - join:
          datasets: [prism_tmin_county]
          join_on: [geo_id, year]

  - id: build_msa_panel
    target: msa_panel
    steps:
      - materialize:
          transforms: [county_to_msa_population]

      - resample:
          dataset: prism_tmin_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county_to_msa_population
          measures:
            tmin_c: { aggregation: weighted_mean }

      - join:
          datasets: [prism_tmin_county]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
