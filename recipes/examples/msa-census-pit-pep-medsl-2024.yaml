# Example recipe: Census MSA panel with PIT, PEP, and MEDSL vote measures.
# Run preflight before build:
#   HHPLAB_NON_INTERACTIVE=1 hhplab build recipe-preflight --recipe recipes/examples/msa-census-pit-pep-medsl-2024.yaml --json
# Inspect the resolved task graph:
#   HHPLAB_NON_INTERACTIVE=1 hhplab build recipe-plan --recipe recipes/examples/msa-census-pit-pep-medsl-2024.yaml --json
#
# MEDSL vote counts are summed from counties to MSAs, then shares/ratios are
# derived from the aggregated counts.

version: 1
name: msa_census_pit_pep_medsl_2024
description: >
  Build a 2024 Census MSA panel with CoC-native PIT counts, county PEP
  population, and county MEDSL presidential vote counts aggregated to official
  Census MSAs.

universe:
  years: [2024]

targets:
  - id: msa_panel
    geometry: { type: msa, source: census_msa_2023 }
    outputs: [panel]

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2024-2024"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2024
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2024.parquet

  pep_county:
    provider: census
    product: pep
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2024-2024"
    year_column: year
    geo_column: county_fips
    path: data/curated/pep/pep_county__v2025__y2020-2025.parquet

  medsl_president:
    provider: medsl
    product: president
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    years: "2024-2024"
    year_column: year
    geo_column: county_fips
    params:
      align: presidential_election_year

transforms:
  - id: coc_to_msa_area
    type: crosswalk
    from: { type: coc, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county_to_msa_area
    type: crosswalk
    from: { type: county, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_msa_panel
    target: msa_panel
    steps:
      - materialize:
          transforms: [coc_to_msa_area, county_to_msa_area]

      - resample:
          dataset: pit
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: coc_to_msa_area
          measures:
            pit_total: { aggregation: sum }
            pit_sheltered: { aggregation: sum }
            pit_unsheltered: { aggregation: sum }

      - resample:
          dataset: pep_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county_to_msa_area
          measures:
            population: { aggregation: sum }

      - resample:
          dataset: medsl_president
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county_to_msa_area
          measures:
            democratic_votes: { aggregation: sum }
            republican_votes: { aggregation: sum }
            two_party_votes: { aggregation: sum }
            totalvotes: { aggregation: sum }
          derived_measures:
            democratic_vote_share:
              type: rate_from_weighted_counts
              source_numerator_column: democratic_votes
              denominator_column: totalvotes
            republican_vote_share:
              type: rate_from_weighted_counts
              source_numerator_column: republican_votes
              denominator_column: totalvotes
            democratic_republican_vote_ratio:
              type: rate_from_weighted_counts
              source_numerator_column: democratic_votes
              denominator_column: republican_votes

      - join:
          datasets: [pit, pep_county, medsl_president]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
