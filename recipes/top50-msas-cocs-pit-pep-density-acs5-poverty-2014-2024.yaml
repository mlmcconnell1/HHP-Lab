# Top 50 2024-population MSAs: contained CoCs with PIT, PEP population,
# and terminal-vintage ACS5 tract population and poverty counts.
#
# The MSA selector_ids are the top 50 Census MSAs by 2024 resident population,
# computed from Census PEP county population aggregated over Census MSA 2023
# county membership. CoCs are kept when at least 99% of their 2025 boundary
# area is contained in one of those MSAs.

version: 1
name: top50_msas_cocs_pit_pep_density_acs5_poverty_2010_2024
description: >
  Build a CoC panel for 2010-2024 with HUD PIT sheltered and unsheltered
  counts plus Census PEP county population allocated to 2025 CoC boundaries
  through tract-mediated decennial population weights, plus tract-level ACS5
  terminal-vintage total population, poverty universe, and persons below the
  poverty level. Each panel year uses the ACS5 vintage ending in that same
  year for both population and poverty, aggregated from the tract vintage
  appropriate to the source year and crosswalk-weighted to 2025 CoC boundaries.
  The ACS5 terminal-year population is promoted to the canonical
  total_population column so it can be compared directly with PEP/ACS1 panels,
  while PEP remains available as pep_population. The panel is filtered to CoCs
  with at least 99% of their 2025 boundary area contained in one of the top 50
  Census MSAs by 2024 PEP population, using Census MSA 2023 membership and 2025
  CoC boundaries.

universe:
  range: "2010-2024"

targets:
  - id: top50_msas_coc_panel
    geometry: { type: coc, vintage: 2025, source: hud_exchange }
    outputs: [panel, containment]
    panel_policy:
      canonical_population_source: acs5
      column_aliases:
        total_population_pep: pep_population
        total_population_acs5: acs5_total_population
        population_below_poverty: acs5_population_below_poverty
        poverty_universe: acs5_poverty_universe
    containment_spec:
      container: { type: msa, vintage: 2023, source: census_msa_2023 }
      candidate: { type: coc, vintage: 2025, source: hud_exchange }
      selector_ids:
        - "35620"
        - "31080"
        - "16980"
        - "19100"
        - "26420"
        - "12060"
        - "47900"
        - "33100"
        - "37980"
        - "38060"
        - "14460"
        - "40140"
        - "41860"
        - "19820"
        - "42660"
        - "33460"
        - "45300"
        - "41740"
        - "19740"
        - "36740"
        - "16740"
        - "12580"
        - "41180"
        - "41700"
        - "12420"
        - "38900"
        - "40900"
        - "38300"
        - "29820"
        - "17140"
        - "28140"
        - "18140"
        - "26900"
        - "17410"
        - "34980"
        - "41940"
        - "47260"
        - "27260"
        - "39300"
        - "33340"
        - "39580"
        - "36420"
        - "31140"
        - "40060"
        - "32820"
        - "41620"
        - "23420"
        - "13820"
        - "24340"
        - "25540"
      min_share: 0.99
      denominator: candidate_area
      definition_version: census_msa_2023
    containment_filter:
      container: { type: msa, vintage: 2023, source: census_msa_2023 }
      candidate: { type: coc, vintage: 2025, source: hud_exchange }
      selector_ids:
        - "35620"
        - "31080"
        - "16980"
        - "19100"
        - "26420"
        - "12060"
        - "47900"
        - "33100"
        - "37980"
        - "38060"
        - "14460"
        - "40140"
        - "41860"
        - "19820"
        - "42660"
        - "33460"
        - "45300"
        - "41740"
        - "19740"
        - "36740"
        - "16740"
        - "12580"
        - "41180"
        - "41700"
        - "12420"
        - "38900"
        - "40900"
        - "38300"
        - "29820"
        - "17140"
        - "28140"
        - "18140"
