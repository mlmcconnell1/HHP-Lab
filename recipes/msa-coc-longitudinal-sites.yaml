# Longitudinal study: 2010–2024, excluding 2021.
# Owner-directed holdouts: CT-503, OR-504 (Salem), PA-512 (York-Hanover).
# Each dependent MSA is excluded consistently across every study year.
# This producer freezes the 2024 geography; years below are geometry production,
# not the longitudinal outcome window.
# Existing exploratory universes and result bundles remain historical records.
version: 1
name: msa_coc_longitudinal_2010_2024_sites
description: >
  Freeze the 99 percent overlap sites for longitudinal PIT/HIC work,
  excluding Bridgeport-Stamford-Danbury (14860), Salem (41420), and
  York-Hanover (49620) by study-owner decision. Intended outcome window
  is 2010-2024 excluding 2021. Historical boundary checks remain separate.
output_root: /home/matt/HHP-Output
universe:
  years: [2024]
targets:
  - id: longitudinal_sites
    geometry: {type: msa, source: census_msa_2023}
    outputs: [msa_coc_sites]
    msa_coc_sites:
      crosswalk_path: data/curated/xwalks/msa_coc_xwalk__N2020@B2024xMcensus_msa_2023xC2023xK2020__basis-block_population.parquet
      msa_universe_path: /home/matt/HHP-Output/msa_coc_longitudinal_sites_inputs/metro_universe__census_msa_2023__exclude_CT503_OR504_PA512.parquet
      coc_names_path: data/curated/coc_boundaries/coc__B2024.parquet
      coc_boundary_vintage: 2024
      msa_definition_version: census_msa_2023
      county_vintage: 2023
      block_vintage: 2020
      decennial_vintage: 2020
      thresholds: [0.99]
datasets: {}
pipelines:
  - id: describe_longitudinal_sites
    target: longitudinal_sites
    steps: []
