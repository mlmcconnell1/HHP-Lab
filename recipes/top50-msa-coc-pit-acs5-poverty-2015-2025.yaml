# Top 50 2025-population Census MSAs with CoC PIT and lagged ACS5 poverty.

version: 1
name: top50_msa_coc_pit_acs5_poverty_2015_2025
description: >
  Build a two-year Census MSA panel for 2015 and 2025, limited to the 50
  largest MSAs by 2025 county PEP population. CoC-native HUD PIT counts from
  the 2025 PIT vintage are rolled up to Census MSAs, county PEP population is
  aggregated to the same MSA geography, and lagged ACS5 tract measures are
  aggregated to MSAs. The ACS measures include population_below_poverty, plus
  the other ACS measures from the msa_census_pit_acs_pep_2020_2021 example.
  The ACS lag follows the project convention for PIT panels: ACS vintage =
  PIT year - 1.

universe:
  years: [2015, 2025]

targets:
  - id: msa_panel
    geometry: { type: msa, source: census_msa_2023 }
    cohort:
      rank_by: population
      method: top_n
      n: 50
      reference_year: 2025
    outputs: [panel]
    panel_policy:
      inflation_adjustment:
        base_year: 2025
        columns:
          - median_gross_rent
          - median_household_income
        factor_column: cpi_u_adjustment_factor

datasets:
  pit:
    provider: hud
    product: pit
    version: 1
    native_geometry: { type: coc }
    years: "2015-2025"
    year_column: pit_year
    geo_column: coc_id
    params:
      vintage: 2025
      align: point_in_time_jan
    path: data/curated/pit/pit_vintage__P2025.parquet

  pep_county:
    provider: census
    product: pep
    version: 1
    native_geometry: { type: county, vintage: 2020 }
    year_column: year
    geo_column: county_fips
    file_set:
      path_template: "data/curated/pep/{pep_file}"
      segments:
        - years: "2015-2015"
          geometry: { type: county, vintage: 2020 }
          constants: { pep_file: "pep_county__v2020.parquet" }
        - years: "2025-2025"
          geometry: { type: county, vintage: 2020 }
          constants: { pep_file: "pep_county__v2025__y2020-2025.parquet" }

  acs_tract:
    provider: census
    product: acs5
    version: 1
    native_geometry: { type: tract }
    geo_column: tract_geoid
    file_set:
      path_template: "data/curated/acs/acs5_tracts__A{acs_end}xT{tract}.parquet"
      segments:
        - years: "2015-2015"
          geometry: { type: tract, vintage: 2010 }
          constants: { tract: 2010 }
          year_offsets: { acs_end: -1 }
        - years: "2025-2025"
          geometry: { type: tract, vintage: 2020 }
          constants: { tract: 2020 }
          year_offsets: { acs_end: -1 }

transforms:
  - id: coc_to_msa
    type: crosswalk
    from: { type: coc, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: county_to_msa
    type: crosswalk
    from: { type: county, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: tract_to_msa_2010
    type: crosswalk
    from: { type: tract, vintage: 2010 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

  - id: tract_to_msa_2020
    type: crosswalk
    from: { type: tract, vintage: 2020 }
    to: { type: msa, source: census_msa_2023 }
    spec:
      weighting:
        scheme: area

pipelines:
  - id: build_msa_panel
    target: msa_panel
    steps:
      - materialize:
          transforms: [coc_to_msa, county_to_msa, tract_to_msa_2010, tract_to_msa_2020]

      - resample:
          dataset: pit
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: coc_to_msa
          measures: [pit_total, pit_sheltered, pit_unsheltered]
          aggregation: sum

      - resample:
          dataset: pep_county
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: county_to_msa
          measures: [population]
          aggregation: sum

      - resample:
          dataset: acs_tract
          to_geometry: { type: msa, source: census_msa_2023 }
          method: aggregate
          via: auto
          measures:
            total_population: { aggregation: sum }
            adult_population: { aggregation: sum }
            population_below_poverty: { aggregation: sum }
            median_household_income: { aggregation: weighted_mean }
            median_gross_rent: { aggregation: weighted_mean }

      - join:
          datasets: [pit, pep_county, acs_tract]
          join_on: [geo_id, year]

validation:
  crosswalk_coverage:
    warn_below: 0.95
    fail_below: 0.90
  missing_dataset:
    default: fail
